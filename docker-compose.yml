services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nomad_cards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nomad_cards_notifier:
    image: dakexduck/nomad_cards_notifier:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      TOKEN: "${TOKEN}"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nomad_cards
      IS_TEST: "${IS_TEST:-true}"
      NOMAD_COLLECTOR_ENABLED: "${NOMAD_COLLECTOR_ENABLED:-false}"
      NOMAD_BASE_URL: "${NOMAD_BASE_URL:-https://ur.nomadoil.kz}"
      NOMAD_TEST_BASE_URL: "${NOMAD_TEST_BASE_URL:-http://host.docker.internal:8080}"
      NOMAD_USERNAME: "${NOMAD_USERNAME}"
      NOMAD_PASSWORD: "${NOMAD_PASSWORD}"
      NOMAD_CLID: "${NOMAD_CLID}"
      NOMAD_NOTIFY_CHAT_ID: "${NOMAD_NOTIFY_CHAT_ID}"
      NOMAD_DAILY_REPORT_CHAT_ID: "${NOMAD_DAILY_REPORT_CHAT_ID:-0}"
      NOMAD_DAILY_REPORT_TIME: "${NOMAD_DAILY_REPORT_TIME:-}"
      NOMAD_COLLECT_INTERVAL: "${NOMAD_COLLECT_INTERVAL:-300}"
      NOMAD_SALES_FROM: "${NOMAD_SALES_FROM:-}"
      NOMAD_SALES_TO: "${NOMAD_SALES_TO:-}"
      NOMAD_STATION_URLS: "${NOMAD_STATION_URLS:-{}}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_TO: "${SMTP_TO:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
